<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
<meta name="hosting-provider" content="Netlify">
<meta name="netlify-deploy" content="https://netlify.new/?utm_campaign=ai-legible&amp;utm_source=meta&amp;utm_medium=referral&amp;utm_id=016fd7af-30ea-4151-aef0-4d716ea85112">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MUHAMMED PIRANI </title>
    <!-- FontAwesome بۆ انستگرام، تیک تۆک و ئیکۆنان -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #05070b radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        color: #c8ced8;
        font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* هێڵێن سکنلی تەلاری و ستافێ ماتریکس (Scanlines & Matrix Grid Effect) */
      body::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                          linear-gradient(90deg, rgba(0, 255, 200, 0.02), rgba(255, 0, 128, 0.01), rgba(0, 100, 255, 0.02));
        z-index: 998;
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
      }

      /* تیشکێن نایاب یێن ل پشت پەیجی (Ambient Glow Orbs) */
      .bg-glow-orb {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(88, 166, 255, 0.18) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
        animation: orbPulse 8s ease-in-out infinite alternate;
      }

      @keyframes orbPulse {
        0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.9; }
      }

      /* لایکێشا سەرەکی (Box) - مەزنتر و هەوسەنگ بۆ شاشا PS4 */
      #brand {
        text-align: center;
        padding: 24px 22px;
        background: rgba(10, 14, 20, 0.92);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(88, 166, 255, 0.35);
        border-radius: 20px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 45px rgba(88, 166, 255, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 420px;
        width: 90%;
        z-index: 2;
        position: relative;
        animation: containerFloat 4s ease-in-out infinite alternate, rgbBorderPulse 8s infinite;
      }

      /* چوار گۆشەیێن تابلۆی یێن تەلاری (Cyberpunk Corner Accents) */
      .corner-tl {
        position: absolute;
        top: -4px;
        left: -4px;
        width: 14px;
        height: 14px;
        border-color: #00ffc8;
        border-style: solid;
        border-width: 2px 0 0 2px;
        border-radius: 4px 0 0 0;
        pointer-events: none;
      }

      .corner-br {
        position: absolute;
        bottom: -4px;
        right: -4px;
        width: 14px;
        height: 14px;
        border-color: #00ffc8;
        border-style: solid;
        border-width: 0 2px 2px 0;
        border-radius: 0 0 4px 0;
        pointer-events: none;
      }

      @keyframes containerFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }

      @keyframes rgbBorderPulse {
        0% { border-color: rgba(88, 166, 255, 0.35); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(88, 166, 255, 0.12); }
        33% { border-color: rgba(255, 0, 128, 0.4); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 0, 128, 0.15); }
        66% { border-color: rgba(0, 255, 200, 0.4); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 255, 200, 0.15); }
        100% { border-color: rgba(88, 166, 255, 0.35); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(88, 166, 255, 0.12); }
      }

      /* دەڤەرا وێنەی لگەل نیشانا پالس ئەکتڤ */
      .image-container {
        position: relative;
        display: inline-block;
      }

      #brand img {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #1f2937;
        box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #brand img:hover {
        transform: scale(1.06) rotate(3deg);
        border-color: #00ffc8;
        box-shadow: 0 15px 30px rgba(0, 255, 200, 0.3);
      }

      .online-badge {
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 14px;
        height: 14px;
        background-color: #00ffc8;
        border: 2px solid #0a0e14;
        border-radius: 50%;
        box-shadow: 0 0 12px #00ffc8;
        animation: pulseBadge 2s infinite;
      }

      @keyframes pulseBadge {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 200, 0.8); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 200, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 200, 0); }
      }

      /* شێوەیێ دابینکرنا دەم و رۆژێ */
      .datetime-box {
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: linear-gradient(135deg, rgba(16, 22, 34, 0.9), rgba(8, 12, 18, 0.95));
        border: 1px solid rgba(0, 255, 200, 0.2);
        padding: 6px 14px;
        border-radius: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      #live-time {
        font-size: 15px;
        font-weight: 700;
        color: #00ffc8;
        letter-spacing: 0.1em;
        font-family: monospace;
        text-shadow: 0 0 10px rgba(0,255,200,0.4);
      }

      #live-date {
        font-size: 9px;
        font-weight: 600;
        color: #8b95a3;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* === EFEK GLITCH KASAR === */
      .glitch-text {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: #e6ebf2;
        position: relative;
        display: inline-block;
        animation: glitch-skew 0.8s infinite linear alternate-reverse;
      }

      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0e14;
      }

      .glitch-text::before {
        left: 2px;
        text-shadow: -2px 0 #ff007f;
        clip: rect(24px, 550px, 36px, 0);
        animation: glitch-anim 0.25s infinite linear alternate-reverse;
      }

      .glitch-text::after {
        left: -2px;
        text-shadow: -2px 0 #00ffc8, 0 2px #ff007f;
        clip: rect(85px, 550px, 140px, 0);
        animation: glitch-anim2 0.3s infinite linear alternate-reverse;
      }

      /* نیشانا نووی بۆ نڤیسینگه‌ها دۆسکی (Dusky Office Badge) */
      .office-badge {
        font-size: 10px;
        font-weight: 700;
        color: #58a6ff;
        background: rgba(88, 166, 255, 0.1);
        border: 1px dashed rgba(88, 166, 255, 0.4);
        padding: 4px 10px;
        border-radius: 6px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      /* شێوەیێ نڤیسینا زێدەکری */
      .support-text {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: #00ffc8;
        background: rgba(16, 22, 34, 0.8);
        border: 1px solid rgba(0, 255, 200, 0.2);
        padding: 6px 12px;
        border-radius: 8px;
        text-transform: uppercase;
        width: 100%;
        box-sizing: border-box;
      }

      /* پشکا ستافێ ترمینال (Terminal Status Bar) */
      .terminal-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(5, 7, 11, 0.9);
        border: 1px solid #1f2937;
        padding: 5px 10px;
        border-radius: 6px;
        width: 100%;
        box-sizing: border-box;
        font-family: monospace;
        font-size: 10px;
        color: #8b95a3;
      }

      .terminal-status span {
        color: #00ffc8;
      }

      .terminal-dots {
        display: flex;
        gap: 4px;
      }

      .terminal-dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
      }

      .terminal-dots i:nth-child(1) { background: #ff5f56; }
      .terminal-dots i:nth-child(2) { background: #ffbd2e; }
      .terminal-dots i:nth-child(3) { background: #27c93f; }

      /* شێوەیێ آیکۆنێن سوشیال مێدیا */
      .social-icons {
        display: flex;
        gap: 12px;
        margin-top: 4px;
      }

      .social-icons a {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 42px;
        height: 42px;
        background: linear-gradient(145deg, #162032, #0d121c);
        color: #c8ced8;
        border-radius: 12px;
        border: 1px solid #2d3748;
        font-size: 18px;
        text-decoration: none;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }

      .social-icons a svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        transition: fill 0.3s ease;
      }

      .social-icons a.instagram:hover {
        background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5914 45%, #c62937 60%, #bc1888 90%);
        color: #fff;
        border-color: transparent;
        transform: translateY(-4px) scale(1.1);
        box-shadow: 0 10px 22px rgba(188, 24, 136, 0.7);
      }

      .social-icons a.tiktok:hover {
        background: #000000;
        color: #fff;
        border-color: #fe2c55;
        transform: translateY(-4px) scale(1.1);
        box-shadow: 0 10px 22px rgba(254, 44, 85, 0.6);
      }

      .social-icons a.x-twitter:hover {
        background: #ffffff;
        color: #000000;
        border-color: #ffffff;
        transform: translateY(-4px) scale(1.1);
        box-shadow: 0 10px 22px rgba(255, 255, 255, 0.5);
      }
      
      .social-icons a.x-twitter:hover svg {
        fill: #000000;
      }

      @keyframes glitch-anim {
        0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.4deg); }
        20% { clip: rect(40px, 9999px, 60px, 0); transform: skew(0.9deg); }
        40% { clip: rect(5px, 9999px, 20px, 0); transform: skew(0.2deg); }
        60% { clip: rect(30px, 9999px, 70px, 0); transform: skew(0.6deg); }
        80% { clip: rect(15px, 9999px, 45px, 0); transform: skew(0.3deg); }
        100% { clip: rect(50px, 9999px, 80px, 0); transform: skew(0.7deg); }
      }

      @keyframes glitch-anim2 {
        0% { clip: rect(25px, 9999px, 55px, 0); transform: skew(0.6deg); }
        20% { clip: rect(2px, 9999px, 35px, 0); transform: skew(0.3deg); }
        40% { clip: rect(50px, 9999px, 90px, 0); transform: skew(1deg); }
        60% { clip: rect(10px, 9999px, 40px, 0); transform: skew(0.5deg); }
        80% { clip: rect(35px, 9999px, 75px, 0); transform: skew(0.8deg); }
        100% { clip: rect(60px, 9999px, 95px, 0); transform: skew(0.2deg); }
      }

      @keyframes glitch-skew {
        0% { transform: skew(0deg); }
        20% { transform: skew(-3deg); }
        40% { transform: skew(3deg); }
        60% { transform: skew(-1deg); }
        80% { transform: skew(4deg); }
        100% { transform: skew(0deg); }
      }

      #delayed-msg {
        position: fixed;
        top: 25px;
        background: linear-gradient(135deg, rgba(16, 22, 34, 0.95), rgba(8, 12, 18, 0.95));
        backdrop-filter: blur(10px);
        color: #00ffc8;
        border: 1px solid rgba(0, 255, 200, 0.4);
        padding: 12px 22px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 15px 40px rgba(0,0,0,0.85), 0 0 25px rgba(0, 255, 200, 0.2);
        display: none;
        z-index: 20000;
        animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px) scale(0.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      #msg, #logs { display: none; }
    </style>
  </head>
  <body>
    <div class="bg-glow-orb"></div>

    <div id="delayed-msg"><i class="fas fa-terminal" style="margin-left: 8px; color: #00ffc8;"></i> Nama Ta Gahisht ! Sopas Bota </div>

    <div id="brand">
      <div class="corner-tl"></div>
      <div class="corner-br"></div>

      <!-- پشکا ستافێ ترمینال -->
      <div class="terminal-status">
        <div class="terminal-dots"><i></i><i></i><i></i></div>
        <div>status: <span>ONLINE_READY</span></div>
      </div>

      <!-- نیشاندانا دەم و رۆژێ -->
      <div class="datetime-box">
        <div id="live-time">00:00:00</div>
        <div id="live-date">Loading date...</div>
      </div>

      <!-- وێنە لگەل نیشانا پالس ئۆنلاین (لێرە mm.png بۆ logo_raw.png هاتە گۆڕین) -->
      <div class="image-container">
        <img src="logo_raw.png" alt="Logo" />
        <div class="online-badge" title="Active"></div>
      </div>
      
      <div class="glitch-text" data-text="MUHAMMED PIRANI">MUHAMMED PIRANI</div>
      
      <!-- نیشانا نڤیسینگه‌ها دۆسکی (Dusky Office) -->
      <div class="office-badge"><i class="fas fa-microchip"></i> DUHOK - KURDİSTAN</div>
      
      <!-- نڤیسینا چاوەڕێ بە -->
      <div class="support-text">PS4 Wişan (13.02 hata 13.52) </div>
      
      <!-- لینکێن انستگرام، تیک تۆک و ئێکس (X) -->
      <div class="social-icons">
        <a href="https://instagram.com/muhammed.pirani" target="_blank" class="instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://tiktok.com/@muhammed_pirani" target="_blank" class="tiktok" title="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="https://x.com/Muhammed_Pirani" target="_blank" class="x-twitter" title="X (Twitter)">
          <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </div>
    </div>

    <div id="msg"></div>
    <div id="logs"></div>

    <script>
      function updateDateTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const formattedTime = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        document.getElementById('live-time').textContent = formattedTime;

        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        const formattedDate = now.toLocaleDateString('en-US', options);
        document.getElementById('live-date').textContent = formattedDate;
      }

      setInterval(updateDateTime, 1000);
      updateDateTime();

      setTimeout(function() {
        var msgBox = document.getElementById('delayed-msg');
        if (msgBox) {
          msgBox.style.display = 'block';
        }
      }, 7000);
    </script>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
