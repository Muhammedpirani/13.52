    <title>MUHAMMED PIRANI</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0b0d10;
        color: #c8ced8;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* Kontainer Animasi dan Teks di Tengah Layar */
      #brand {
        text-align: center;
        padding: 20px;
        background: #0e1116;
        border: 1px solid #1e2732;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      #brand img {
        width: 300px;
        height: 300px;
        object-fit: contain;
        border-radius: 12px;
      }

      /* === PERBAIKAN EFEK GLITCH KASAR === */
      .glitch-text {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: #e6ebf2;
        position: relative;
        display: inline-block;
        animation: glitch-skew 0.8s infinite linear alternate-reverse;
      }

      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0e1116;
      }

      .glitch-text::before {
        left: 2px;
        text-shadow: -2px 0 #ff0055;
        clip: rect(24px, 550px, 36px, 0);
        animation: glitch-anim 0.25s infinite linear alternate-reverse;
      }

      .glitch-text::after {
        left: -2px;
        text-shadow: -2px 0 #00ffff, 0 2px #ff0055;
        clip: rect(85px, 550px, 140px, 0);
        animation: glitch-anim2 0.3s infinite linear alternate-reverse;
      }

      @keyframes glitch-anim {
        0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.4deg); }
        20% { clip: rect(40px, 9999px, 60px, 0); transform: skew(0.9deg); }
        40% { clip: rect(5px, 9999px, 20px, 0); transform: skew(0.2deg); }
        60% { clip: rect(30px, 9999px, 70px, 0); transform: skew(0.6deg); }
        80% { clip: rect(15px, 9999px, 45px, 0); transform: skew(0.3deg); }
        100% { clip: rect(50px, 9999px, 80px, 0); transform: skew(0.7deg); }
      }

      @keyframes glitch-anim2 {
        0% { clip: rect(25px, 9999px, 55px, 0); transform: skew(0.6deg); }
        20% { clip: rect(2px, 9999px, 35px, 0); transform: skew(0.3deg); }
        40% { clip: rect(50px, 9999px, 90px, 0); transform: skew(1deg); }
        60% { clip: rect(10px, 9999px, 40px, 0); transform: skew(0.5deg); }
        80% { clip: rect(35px, 9999px, 75px, 0); transform: skew(0.8deg); }
        100% { clip: rect(60px, 9999px, 95px, 0); transform: skew(0.2deg); }
      }

      @keyframes glitch-skew {
        0% { transform: skew(0deg); }
        20% { transform: skew(-3deg); }
        40% { transform: skew(3deg); }
        60% { transform: skew(-1deg); }
        80% { transform: skew(4deg); }
        100% { transform: skew(0deg); }
      }

      #msg {
        position: fixed;
        top: calc(50% + 180px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 16px;
        display: none;
        z-index: 10000;
        color: #fff;
      }

      body.fail #msg {
        display: block;
      }

      #logs {
        margin: 16px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 12px;
        color: #8b95a3;
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Animasi dan Teks Mario dengan Efek Glitch Kasar -->
    <div id="brand">
      <img src="mm.png" alt="Logo" />
      <div class="glitch-text" data-text=>MUHAMMED PIRANI</div>
    </div>

    <div id="msg"></div>
    <div id="logs"></div>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
