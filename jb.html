<!doctype html>
<html lang="ku" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MUHAMMED PİRANİ &bull; PS4 JAILBREAK HOST</title>
    <style>
      :root {
        --bg-main: #0b0d10;
        --bg-brand: #0e1116;
        --border-col: #1e2732;
        --text-main: #c8ced8;
        --accent-ok: #7fd0a0;
        --accent-bad: #d08a7f;
        --accent-warn: #d8c07f;
        --accent-blue: #3b82f6;
        --glow: rgba(59, 130, 246, 0.35);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg-main);
        color: var(--text-main);
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      #brand {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        background: var(--bg-brand);
        border-bottom: 1px solid var(--border-col);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }

      /* لۆگۆیا MP یا پاقژ و رێکوپێک */
      #brand .brand-logo-text {
        width: 40px;
        height: 40px;
        margin-left: 14px;
        margin-right: 0;
        border-radius: 12px;
        background: linear-gradient(145deg, #3b82f6, #1d4ed8);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 0.05em;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 14px var(--glow);
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }

      #brand .brand-text-group {
        text-align: right;
      }

      #brand .brand-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        display: block;
        text-decoration: none;
      }

      #brand .brand-sub {
        font-size: 10px;
        color: var(--accent-blue);
        letter-spacing: 0.12em;
        font-weight: 600;
        display: block;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--border-col);
        border-top-color: var(--accent-ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid var(--border-col);
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <div class="brand-text-group">
        <span class="brand-title">MUHAMMED PİRANİ</span>
        <span class="brand-sub">PS4 (13.02 HATA 13.52)</span>
      </div>
      <div class="brand-logo-text">MP</div>
    </div>
    <div id="spin"></div>
    <div id="msg">Amêرا خۆ ڤەگۆڕە (Restart your console)</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
